<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="工作台">
<meta name="theme-color" content="#FFE8F0">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='42' fill='%23FFE8F0'/%3E%3Ctext x='96' y='130' font-size='90' text-anchor='middle'%3E%E2%9C%85%3C/text%3E%3C/svg%3E">
<title>工作台 · 完整版</title>
<style>
/* ===== 基础变量 ===== */
:root{
  --pink-bg:#FFE8F0;
  --blue-bg:#E6F2FF;
  --card-bg:#FFFFFF;
  --radius:18px;
  --radius-sm:12px;
  --divider:#E8ECF0;
  --text-main:#3A3A3A;
  --text-sub:#7A7A7A;
  --text-light:#A0A0A0;
  --sidebar-w:100px;
  --shadow:0 2px 12px rgba(120,120,140,0.08);
  --shadow-card:0 1px 8px rgba(120,120,140,0.06);
  --accent:#E8869E;
  --accent-blue:#6BA4D6;
  --done-bg:#FFE8F0;
  --undone-bg:#E6F2FF;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(160deg,#FFF5F8 0%,#F0F6FF 100%);
  color:var(--text-main);
  font-size:14px;
  line-height:1.5;
}
/* ===== App 容器 ===== */
.app{
  max-width:430px;
  height:100vh;
  margin:0 auto;
  background:#FAFBFC;
  display:flex;
  flex-direction:column;
  position:relative;
  box-shadow:0 0 30px rgba(0,0,0,0.05);
  overflow:hidden;
}

/* ===== Header ===== */
.header{
  padding:14px 16px 12px;
  background:linear-gradient(135deg,var(--pink-bg) 0%,var(--blue-bg) 100%);
  flex-shrink:0;
  z-index:10;
}
.header-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.greeting{font-size:18px;font-weight:700;color:#3A3A3A;}
.date-text{font-size:11px;color:#6A6A6A;margin-top:2px;}

/* 今日总览卡片 */
.today-card{
  background:rgba(255,255,255,0.85);
  border-radius:14px;
  padding:10px 12px;
  backdrop-filter:blur(6px);
}
.today-card-title{
  font-size:12px;
  font-weight:600;
  color:#5A5A5A;
  margin-bottom:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.today-progress-text{font-size:11px;color:var(--text-light);font-weight:400;}
.today-bar{
  height:5px;
  background:#EEE;
  border-radius:3px;
  overflow:hidden;
  margin-bottom:8px;
}
.today-bar-fill{
  height:100%;
  background:linear-gradient(90deg,#E8869E,#6BA4D6);
  border-radius:3px;
  transition:width .3s ease;
}
.today-list{display:flex;flex-wrap:wrap;gap:6px;}
.today-item{
  font-size:11px;
  padding:4px 10px;
  border-radius:20px;
  background:#F5F5F5;
  color:#777;
  display:flex;
  align-items:center;
  gap:4px;
  cursor:pointer;
  transition:all .15s;
  border:1px solid transparent;
}
.today-item.done{background:var(--done-bg);color:#C66B85;border-color:rgba(232,134,158,0.2);}
.today-item.undone{background:var(--undone-bg);color:#4A7FB0;border-color:rgba(107,164,214,0.15);}
.today-item:active{transform:scale(0.95);}
.today-item .dot{width:6px;height:6px;border-radius:50%;background:#CCC;}
.today-item.done .dot{background:#E8869E;}
.today-item.undone .dot{background:#6BA4D6;}

/* ===== 主体布局 ===== */
.main-body{
  flex:1;
  display:flex;
  overflow:hidden;
}

/* ===== 侧边栏 ===== */
.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:#F8F9FB;
  border-right:1px solid var(--divider);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.sidebar-scroll{
  flex:1;
  overflow-y:auto;
  padding:8px 0;
  -webkit-overflow-scrolling:touch;
}
.sidebar-scroll::-webkit-scrollbar{width:0;}
.sidebar-section-label{
  font-size:9px;
  color:var(--text-light);
  padding:8px 12px 4px;
  text-transform:uppercase;
  letter-spacing:0.5px;
}
.sidebar-item{
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:10px 4px;
  margin:2px 8px;
  border-radius:12px;
  cursor:pointer;
  transition:background .15s;
  position:relative;
}
.sidebar-item:active{background:#EDEEF0;}
.sidebar-item.active{background:#FFF;border:1px solid var(--divider);box-shadow:var(--shadow-card);}
.sidebar-item.active .si-name{color:var(--accent);font-weight:600;}
.si-icon{font-size:22px;margin-bottom:4px;line-height:1;}
.si-name{font-size:10px;color:var(--text-sub);text-align:center;line-height:1.3;word-break:break-all;}
.si-edit-btn{
  position:absolute;
  top:4px;right:4px;
  width:16px;height:16px;
  border-radius:50%;
  background:rgba(0,0,0,0.06);
  display:none;
  align-items:center;
  justify-content:center;
  font-size:9px;
  color:#888;
  line-height:1;
}
.sidebar-item:hover .si-edit-btn{display:flex;}
.si-edit-btn:active{background:rgba(0,0,0,0.12);}

.sidebar-add{
  margin:8px;
  padding:10px;
  border-radius:12px;
  background:#FFF;
  border:1px dashed var(--divider);
  text-align:center;
  font-size:11px;
  color:var(--text-light);
  cursor:pointer;
  flex-shrink:0;
}
.sidebar-add:active{background:#F5F5F5;}

/* ===== 详情面板 ===== */
.detail-panel{
  flex:1;
  overflow-y:auto;
  padding:14px 14px 30px;
  -webkit-overflow-scrolling:touch;
}
.detail-panel::-webkit-scrollbar{width:0;}

.module-title{
  font-size:16px;
  font-weight:700;
  color:var(--text-main);
  margin-bottom:12px;
  display:flex;
  align-items:center;
  gap:6px;
}
.module-title .mt-icon{font-size:20px;}

/* ===== 通用卡片 ===== */
.card{
  background:var(--card-bg);
  border-radius:var(--radius);
  padding:14px;
  margin-bottom:12px;
  box-shadow:var(--shadow-card);
}
.card-title{
  font-size:13px;
  font-weight:600;
  color:#4A4A4A;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.card-title .ct-action{font-size:11px;color:var(--accent);cursor:pointer;font-weight:400;}

/* ===== 日历组件 ===== */
.calendar-wrap{overflow:hidden;}
.calendar-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}
.cal-month-label{font-size:14px;font-weight:600;color:#3A3A3A;}
.cal-nav-btn{
  width:28px;height:28px;
  border-radius:50%;
  border:none;
  background:#F5F5F5;
  font-size:14px;
  color:#666;
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.cal-nav-btn:active{background:#E8E8E8;}
.calendar-scroll{
  overflow-x:hidden;
  scroll-snap-type:x mandatory;
  display:flex;
  scroll-behavior:smooth;
}
.cal-month{
  flex:0 0 100%;
  scroll-snap-align:start;
}
.cal-weekdays{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  margin-bottom:4px;
}
.cal-weekday{
  text-align:center;
  font-size:10px;
  color:var(--text-light);
  padding:4px 0;
}
.cal-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:3px;
}
.cal-day{
  aspect-ratio:1;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  cursor:pointer;
  transition:all .15s;
  position:relative;
  background:#F8F8F8;
  color:#666;
}
.cal-day.empty{background:transparent;cursor:default;}
.cal-day.done{background:var(--done-bg);color:#C66B85;font-weight:600;}
.cal-day.undone{background:var(--undone-bg);color:#4A7FB0;}
.cal-day.today{border:2px solid var(--accent);}
.cal-day.future{opacity:0.4;cursor:default;}
.cal-day:active:not(.empty):not(.future){transform:scale(0.92);}
.cal-day .has-note{
  position:absolute;
  bottom:2px;left:50%;
  transform:translateX(-50%);
  width:4px;height:4px;
  border-radius:50%;
  background:var(--accent);
}
.cal-day.done .has-note{background:#C66B85;}

.cal-stats{
  display:flex;
  gap:8px;
  margin-top:10px;
}
.cal-stat-box{
  flex:1;
  background:#F9FAFB;
  border-radius:10px;
  padding:8px 10px;
  text-align:center;
}
.cal-stat-num{font-size:18px;font-weight:700;color:#3A3A3A;}
.cal-stat-label{font-size:10px;color:var(--text-light);}
.cal-stat-box.done-stat .cal-stat-num{color:#C66B85;}
.cal-stat-box.rate-stat .cal-stat-num{color:var(--accent-blue);}

/* ===== 输入框 ===== */
.input-field{
  width:100%;
  border:1px solid var(--divider);
  border-radius:var(--radius-sm);
  padding:10px 12px;
  font-size:13px;
  color:var(--text-main);
  background:#FAFBFC;
  outline:none;
  font-family:inherit;
  resize:vertical;
  transition:border-color .15s;
}
.input-field:focus{border-color:var(--accent);background:#FFF;}
textarea.input-field{min-height:60px;}
.input-label{font-size:11px;color:var(--text-light);margin-bottom:4px;margin-top:8px;display:block;}

/* ===== 按钮 ===== */
.btn{
  padding:8px 16px;
  border-radius:var(--radius-sm);
  border:none;
  font-size:13px;
  cursor:pointer;
  font-family:inherit;
  transition:all .15s;
}
.btn-primary{background:var(--accent);color:#FFF;}
.btn-primary:active{background:#D67A92;}
.btn-secondary{background:#F0F0F0;color:#666;}
.btn-secondary:active{background:#E5E5E5;}
.btn-sm{padding:5px 10px;font-size:11px;}

/* ===== 日历弹窗 ===== */
.cal-modal-overlay{
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.3);
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.cal-modal-overlay.show{display:flex;}
.cal-modal{
  background:#FFF;
  border-radius:var(--radius);
  padding:16px;
  width:100%;
  max-width:320px;
  box-shadow:0 10px 40px rgba(0,0,0,0.2);
}
.cal-modal-title{font-size:15px;font-weight:600;margin-bottom:12px;text-align:center;}
.cal-modal-date{font-size:12px;color:var(--text-light);text-align:center;margin-bottom:12px;}
.cal-modal-actions{display:flex;gap:8px;margin-top:12px;}
.cal-modal-actions .btn{flex:1;}

/* ===== 通用弹窗 ===== */
.modal-overlay{
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.3);
  z-index:200;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.modal-overlay.show{display:flex;}
.modal-box{
  background:#FFF;
  border-radius:var(--radius);
  padding:18px;
  width:100%;
  max-width:300px;
  box-shadow:0 10px 40px rgba(0,0,0,0.2);
}
.modal-title{font-size:15px;font-weight:600;margin-bottom:12px;}
.modal-actions{display:flex;gap:8px;margin-top:14px;}
.modal-actions .btn{flex:1;}

/* ===== 列表项 ===== */
.list-item{
  background:#F9FAFB;
  border-radius:var(--radius-sm);
  padding:10px 12px;
  margin-bottom:8px;
  font-size:12px;
  color:#555;
  position:relative;
}
.list-item:last-child{margin-bottom:0;}
.list-item-title{font-weight:600;color:#3A3A3A;margin-bottom:4px;font-size:13px;}
.list-item-desc{color:var(--text-sub);font-size:11px;}
.list-item-actions{
  display:flex;
  gap:6px;
  margin-top:6px;
}
.list-item-actions .btn{padding:3px 8px;font-size:10px;}

/* ===== 空状态 ===== */
.empty-state{
  text-align:center;
  padding:30px 16px;
  color:var(--text-light);
  font-size:12px;
}
.empty-state-icon{font-size:36px;margin-bottom:8px;opacity:0.4;}

/* ===== 标签 ===== */
.tag{
  display:inline-block;
  padding:2px 8px;
  border-radius:10px;
  font-size:10px;
  font-weight:500;
}
.tag-pink{background:var(--done-bg);color:#C66B85;}
.tag-blue{background:var(--undone-bg);color:#4A7FB0;}
.tag-green{background:#E8F5E9;color:#4CAF50;}
.tag-orange{background:#FFF3E0;color:#E65100;}

/* ===== 分区标签 ===== */
.section-tabs{
  display:flex;
  gap:6px;
  margin-bottom:12px;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
}
.section-tabs::-webkit-scrollbar{width:0;height:0;}
.section-tab{
  padding:6px 14px;
  border-radius:20px;
  font-size:12px;
  white-space:nowrap;
  cursor:pointer;
  background:#F0F0F0;
  color:#777;
  border:none;
  font-family:inherit;
  transition:all .15s;
}
.section-tab.active{background:var(--accent);color:#FFF;}

/* ===== 收藏/收藏夹 ===== */
.fav-item{
  background:#F9FAFB;
  border-radius:var(--radius-sm);
  padding:10px 12px;
  margin-bottom:8px;
  display:flex;
  align-items:flex-start;
  gap:8px;
}
.fav-item-content{flex:1;min-width:0;}
.fav-item-title{font-size:13px;font-weight:600;color:#3A3A3A;word-break:break-all;}
.fav-item-link{font-size:11px;color:var(--accent-blue);word-break:break-all;text-decoration:underline;}
.fav-item-del{
  color:#CCC;
  font-size:16px;
  cursor:pointer;
  padding:0 4px;
  flex-shrink:0;
}

/* ===== 步骤表单 ===== */
.step-row{
  display:flex;
  gap:8px;
  align-items:center;
  margin-bottom:8px;
}
.step-row .input-field{flex:1;}
.step-num{
  width:24px;height:24px;
  border-radius:50%;
  background:var(--pink-bg);
  color:#C66B85;
  font-size:11px;
  font-weight:600;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}

/* ===== 统计表 ===== */
.weekly-table{
  width:100%;
  border-collapse:collapse;
  font-size:11px;
}
.weekly-table th{
  background:#F5F5F5;
  padding:6px;
  text-align:center;
  color:#777;
  font-weight:500;
  border-radius:6px;
}
.weekly-table td{
  padding:6px;
  text-align:center;
  border-bottom:1px solid var(--divider);
  color:#555;
}
.weekly-table td.done-cell{background:var(--done-bg);color:#C66B85;}
.weekly-table td.undone-cell{background:var(--undone-bg);color:#4A7FB0;}

/* ===== Toast ===== */
.toast{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%) translateY(100px);
  background:rgba(0,0,0,0.75);
  color:#FFF;
  padding:8px 20px;
  border-radius:20px;
  font-size:12px;
  z-index:300;
  transition:transform .3s ease;
  pointer-events:none;
  white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0);}

/* ===== 响应式 ===== */
@media(max-width:380px){
  :root{--sidebar-w:88px;}
  .si-icon{font-size:20px;}
  .si-name{font-size:9px;}
  .detail-panel{padding:10px 10px 30px;}
}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- Header -->
  <div class="header">
    <div class="header-top">
      <div>
        <div class="greeting" id="greeting">你好</div>
        <div class="date-text" id="dateText"></div>
      </div>
    </div>
    <div class="today-card" id="todayCard">
      <div class="today-card-title">
        <span>今日总览</span>
        <span class="today-progress-text" id="todayProgressText">0/0</span>
      </div>
      <div class="today-bar"><div class="today-bar-fill" id="todayBarFill" style="width:0%"></div></div>
      <div class="today-list" id="todayList"></div>
    </div>
  </div>

  <!-- Main Body -->
  <div class="main-body">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-scroll" id="sidebarScroll">
        <div class="sidebar-section-label">固定模块</div>
        <div id="fixedModules"></div>
        <div class="sidebar-section-label">自定义</div>
        <div id="customModules"></div>
      </div>
      <div class="sidebar-add" id="addModuleBtn">+ 新增模块</div>
    </div>

    <!-- Detail Panel -->
    <div class="detail-panel" id="detailPanel"></div>
  </div>
</div>

<!-- Calendar Modal -->
<div class="cal-modal-overlay" id="calModalOverlay">
  <div class="cal-modal">
    <div class="cal-modal-title" id="calModalTitle">打卡</div>
    <div class="cal-modal-date" id="calModalDate"></div>
    <textarea class="input-field" id="calModalNote" placeholder="输入备注..."></textarea>
    <div class="cal-modal-actions">
      <button class="btn btn-secondary" id="calModalCancel">取消</button>
      <button class="btn btn-secondary" id="calModalUncheck">取消打卡</button>
      <button class="btn btn-primary" id="calModalConfirm">完成打卡</button>
    </div>
  </div>
</div>

<!-- Generic Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">提示</div>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   工作台完整版 - 主逻辑
   ============================================================ */

/* ===== 常量 ===== */
var FIXED_MODULES = [
  { id:'m1', name:'每日随笔', icon:'✏️', fixed:true },
  { id:'m2', name:'英语听力', icon:'🎧', fixed:true },
  { id:'m3', name:'瑜伽拉伸', icon:'🧘', fixed:true },
  { id:'m4', name:'化妆护肤', icon:'💄', fixed:true },
  { id:'m5', name:'保健调理', icon:'💊', fixed:true },
  { id:'m6', name:'经络养生', icon:'🌿', fixed:true },
  { id:'m7', name:'理财台账', icon:'📊', fixed:true },
  { id:'m8', name:'自媒体学', icon:'📱', fixed:true }
];

/* 日历打卡模块 ID 列表 */
var CALENDAR_MODULES = ['m1','m2','m3'];

/* ===== 状态 ===== */
var state = {
  currentModule: 'm1',
  calDisplayMonth: {}, // { moduleId: { year, month } }
  currentCalEdit: null, // { moduleId, dateStr }
  healthTab: 'daily',
  customModules: []
};

/* ===== 工具函数 ===== */
function $(id){ return document.getElementById(id); }
function formatDate(d){
  var y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function todayStr(){ return formatDate(new Date()); }
function getGreeting(){
  var h = new Date().getHours();
  if(h<6) return '夜深了';
  if(h<11) return '早上好';
  if(h<14) return '中午好';
  if(h<18) return '下午好';
  if(h<22) return '晚上好';
  return '夜深了';
}
function getDateText(){
  var d = new Date();
  var weeks = ['日','一','二','三','四','五','六'];
  return (d.getMonth()+1)+'月'+d.getDate()+'日 星期'+weeks[d.getDay()];
}
function showToast(msg){
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 1800);
}

/* ===== Storage ===== */
function lsGet(key){
  try{ return JSON.parse(localStorage.getItem(key)); }catch(e){ return null; }
}
function lsSet(key, val){
  localStorage.setItem(key, JSON.stringify(val));
}
function calKey(moduleId, dateStr){
  return 'cal_'+moduleId+'_'+dateStr;
}
function getCalData(moduleId, dateStr){
  return lsGet(calKey(moduleId, dateStr)) || { done:false, note:'' };
}
function setCalData(moduleId, dateStr, data){
  lsSet(calKey(moduleId, dateStr), data);
}
function getCustomModules(){
  return lsGet('custom_modules') || [];
}
function setCustomModules(modules){

}

/* ===== 日期辅助 ===== */
function daysInMonth(year, month){
  return new Date(year, month+1, 0).getDate();
}
function firstDayOfWeek(year, month){
  return new Date(year, month, 1).getDay();
}
function isSameDay(d1, d2){
  return d1.getFullYear()===d2.getFullYear() && d1.getMonth()===d2.getMonth() && d1.getDate()===d2.getDate();
}
function isFuture(dateStr){
  var d = new Date(dateStr);
  var today = new Date();
  today.setHours(23,59,59,999);
  return d > today;
}

   渲染：Header / 今日总览
   ============================================================ */

function renderTodayCard(){
  var today = todayStr();
  var items = [];
  var doneCount = 0;
  var totalCount = 0;

  // 从日历模块提取
  CALENDAR_MODULES.forEach(function(mid){
    var m = findModule(mid);
    if(!m) return;
    var data = getCalData(mid, today);
    totalCount++;
    if(data.done) doneCount++;
    items.push({
      moduleId: mid,
      name: m.name,
      icon: m.icon,
      done: data.done
    });
  });

  // 化妆护肤：今日打卡（无日历，但有今日护肤打卡概念）
  // 保健调理：今日打卡
  // 这些模块无日历，但我们在今日总览中仍可展示
  var extraModules = [
    { moduleId:'m4', name:'护肤打卡', icon:'💄' },
    { moduleId:'m5', name:'保健服用', icon:'💊' },
    { moduleId:'m7', name:'盈亏记录', icon:'📊' },
    { moduleId:'m8', name:'文案学习', icon:'📱' }
  ];
  extraModules.forEach(function(em){
    var key = 'today_extra_'+em.moduleId+'_'+today;
    var done = lsGet(key) || false;
    totalCount++;
    if(done) doneCount++;
    items.push({
      moduleId: em.moduleId,
      name: em.name,
      icon: em.icon,
      done: done,
      isExtra: true
    });
  });

  // 渲染进度条
  var pct = totalCount > 0 ? Math.round(doneCount/totalCount*100) : 0;
  $('todayProgressText').textContent = doneCount+'/'+totalCount;
  $('todayBarFill').style.width = pct+'%';

  // 渲染列表
  var listEl = $('todayList');
  listEl.innerHTML = '';
  items.forEach(function(item){
    var el = document.createElement('div');
    el.className = 'today-item ' + (item.done ? 'done' : 'undone');
    el.innerHTML = '<span class="dot"></span>'+item.icon+' '+item.name;
    el.onclick = function(){
      switchModule(item.moduleId);
    };
    listEl.appendChild(el);
  });
}

/* ============================================================
   渲染：侧边栏
   ============================================================ */
function renderSidebar(){
  var fixedEl = $('fixedModules');
  fixedEl.innerHTML = '';
  FIXED_MODULES.forEach(function(m){
    fixedEl.appendChild(createSidebarItem(m));
  });

  var customEl = $('customModules');
  customEl.innerHTML = '';
  state.customModules.forEach(function(m){
    customEl.appendChild(createSidebarItem(m));
  });

  // 高亮当前
  updateSidebarActive();
}

function createSidebarItem(m){
  var el = document.createElement('div');
  el.className = 'sidebar-item';
  el.dataset.moduleId = m.id;
  el.innerHTML =
    '<div class="si-icon">'+m.icon+'</div>'+
    '<div class="si-name">'+m.name+'</div>';
  if(!m.fixed){
    var editBtn = document.createElement('div');
    editBtn.className = 'si-edit-btn';
    editBtn.textContent = '✎';
    editBtn.onclick = function(e){
      e.stopPropagation();
      showEditModuleModal(m.id);
    };
    el.appendChild(editBtn);

    // 长按删除
    var pressTimer = null;
    el.addEventListener('touchstart', function(){
      pressTimer = setTimeout(function(){
        showEditModuleModal(m.id);
      }, 600);
    });
    el.addEventListener('touchend', function(){ clearTimeout(pressTimer); });
    el.addEventListener('touchmove', function(){ clearTimeout(pressTimer); });
  } else {
    // 固定模块也可重命名
    var editBtn2 = document.createElement('div');
    editBtn2.className = 'si-edit-btn';
    editBtn2.textContent = '✎';
    editBtn2.onclick = function(e){
      e.stopPropagation();
      showRenameModuleModal(m.id);
    };
    el.appendChild(editBtn2);
  }
  el.onclick = function(){
    switchModule(m.id);
  };
  return el;
}

function updateSidebarActive(){
  var items = document.querySelectorAll('.sidebar-item');
  items.forEach(function(el){
    if(el.dataset.moduleId === state.currentModule){
      el.classList.add('active');
    } else {
      el.classList.remove('active');
    }
  });
}

function switchModule(moduleId){
  state.currentModule = moduleId;
  updateSidebarActive();
  renderDetail();
}

function renderFinanceMonthlyStats(){
  var list = lsGet('finance_records') || [];
  var now = new Date();
  var monthPrefix = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  var monthRecords = list.filter(function(r){ return r.date.startsWith(monthPrefix); });
  var total = monthRecords.reduce(function(s,r){ return s+r.amount; }, 0);
  var profit = monthRecords.filter(function(r){ return r.amount>0; }).reduce(function(s,r){ return s+r.amount; }, 0);
  var loss = monthRecords.filter(function(r){ return r.amount<0; }).reduce(function(s,r){ return s+r.amount; }, 0);
  var html = '';
  html += '<div class="cal-stats">';
  html += '<div class="cal-stat-box"><div class="cal-stat-num" style="color:'+(total>=0?'#4CAF50':'#C66B85')+'">'+(total>=0?'+':'')+total+'</div><div class="cal-stat-label">本月净盈亏</div></div>';
  html += '<div class="cal-stat-box done-stat"><div class="cal-stat-num">+'+profit+'</div><div class="cal-stat-label">总盈利</div></div>';
  html += '<div class="cal-stat-box rate-stat"><div class="cal-stat-num">'+loss+'</div><div class="cal-stat-label">总亏损</div></div>';
  html += '</div>';
  html += '<div style="font-size:11px;color:var(--text-light);margin-top:8px;">共 '+monthRecords.length+' 笔记录</div>';
  return html;
}

function delCustomItem(moduleId, idx){

}

/* ============================================================
   日历组件渲染
   ============================================================ */
function renderCalendarCard(moduleId, title){
  var now = new Date();
  var display = state.calDisplayMonth[moduleId] || { year: now.getFullYear(), month: now.getMonth() };
  state.calDisplayMonth[moduleId] = display;

  var html = '';
  html += '<div class="card calendar-wrap">';
  html += '<div class="calendar-header">';
  html += '<button class="cal-nav-btn" onclick="changeCalMonth(\''+moduleId+'\,-1)">‹</button>';
  html += '<div class="cal-month-label">'+display.year+'年'+(display.month+1)+'月</div>';
  html += '<button class="cal-nav-btn" onclick="changeCalMonth(\''+moduleId+'\',1)">›</button>';
  html += '</div>';
  html += '<div class="cal-weekdays">';
  var weekdays = ['日','一','二','三','四','五','六'];
  weekdays.forEach(function(w){ html += '<div class="cal-weekday">'+w+'</div>'; });
  html += '</div>';
  html += '<div class="cal-grid" id="calGrid_'+moduleId+'">';
  html += renderCalendarGrid(moduleId, display.year, display.month);
  html += '</div>';
  html += '<div class="cal-stats">';
  var stats = getMonthlyCalStats(moduleId, display.year, display.month);
  html += '<div class="cal-stat-box done-stat"><div class="cal-stat-num">'+stats.done+'</div><div class="cal-stat-label">已完成</div></div>';
  html += '<div class="cal-stat-box"><div class="cal-stat-num">'+stats.total+'</div><div class="cal-stat-label">总天数</div></div>';
  html += '<div class="cal-stat-box rate-stat"><div class="cal-stat-num">'+stats.rate+'%</div><div class="cal-stat-label">完成率</div></div>';
  html += '</div>';
  html += '</div>';
  return html;
}

function renderCalendarGrid(moduleId, year, month){
  var total = daysInMonth(year, month);
  var firstDay = firstDayOfWeek(year, month);
  var today = new Date();
  var html = '';
  // 空格
  for(var i=0; i<firstDay; i++){
    html += '<div class="cal-day empty"></div>';
  }
  for(var d=1; d<=total; d++){
    var dateStr = year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var data = getCalData(moduleId, dateStr);
    var classes = 'cal-day';
    if(data.done) classes += ' done';
    else classes += ' undone';
    var dateObj = new Date(year, month, d);
    if(isSameDay(dateObj, today)) classes += ' today';
    if(isFuture(dateStr)) classes += ' future';
    html += '<div class="'+classes+'" onclick="onCalDayClick(\''+moduleId+'\',\''+dateStr+'\')">'+d;
    if(data.note) html += '<div class="has-note"></div>';
    html += '</div>';
  }
  return html;
}

function afterCalendarRender(moduleId){
  // nothing extra needed since grid is in innerHTML
}

function changeCalMonth(moduleId, delta){
  var display = state.calDisplayMonth[moduleId];
  if(!display){
    var now = new Date();
    display = { year: now.getFullYear(), month: now.getMonth() };
  }
  var m = display.month + delta;
  var y = display.year;
  if(m < 0){ m = 11; y--; }
  if(m > 11){ m = 0; y++; }
  state.calDisplayMonth[moduleId] = { year: y, month: m };
  // 只更新日历卡片部分
  var grid = $('calGrid_'+moduleId);
  if(grid){
    grid.innerHTML = renderCalendarGrid(moduleId, y, m);
  }
  // 更新月份标签
  var label = grid ? grid.parentElement.querySelector('.cal-month-label') : null;
  if(label) label.textContent = y+'年'+(m+1)+'月';
  // 更新统计
  var statsContainer = grid ? grid.parentElement.querySelector('.cal-stats') : null;
  if(statsContainer){
    var stats = getMonthlyCalStats(moduleId, y, m);
    statsContainer.innerHTML =
      '<div class="cal-stat-box done-stat"><div class="cal-stat-num">'+stats.done+'</div><div class="cal-stat-label">已完成</div></div>'+
      '<div class="cal-stat-box"><div class="cal-stat-num">'+stats.total+'</div><div class="cal-stat-label">总天数</div></div>'+
      '<div class="cal-stat-box rate-stat"><div class="cal-stat-num">'+stats.rate+'%</div><div class="cal-stat-label">完成率</div></div>';
  }
}

function onCalDayClick(moduleId, dateStr){
  if(isFuture(dateStr)) return;
  var data = getCalData(moduleId, dateStr);
  state.currentCalEdit = { moduleId: moduleId, dateStr: dateStr };
  $('calModalTitle').textContent = '打卡';
  $('calModalDate').textContent = dateStr;
  $('calModalNote').value = data.note || '';
  $('calModalOverlay').classList.add('show');
  setTimeout(function(){ $('calModalNote').focus(); }, 100);
}

function closeCalModal(){
  $('calModalOverlay').classList.remove('show');
  state.currentCalEdit = null;
}

function confirmCalModal(done){
  if(!state.currentCalEdit) return;
  var ce = state.currentCalEdit;
  var data = getCalData(ce.moduleId, ce.dateStr);
  data.done = done;
  data.note = $('calModalNote').value;
  setCalData(ce.moduleId, ce.dateStr, data);
  closeCalModal();
  renderDetail();
  renderHeader();
}

/* ===== 日历统计 ===== */
function getMonthlyCalStats(moduleId, year, month){
  var total = daysInMonth(year, month);
  var done = 0;
  var now = new Date();
  for(var d=1; d<=total; d++){
    var dateStr = year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    var data = getCalData(moduleId, dateStr);
    if(data.done) done++;
  }
  // 只统计到今天的天数作为分母（如果是当月）
  var nowDate = new Date();
  if(year === nowDate.getFullYear() && month === nowDate.getMonth()){
    total = nowDate.getDate();
  }
  var rate = total > 0 ? Math.round(done/total*100) : 0;
  return { done:done, total:total, rate:rate };
}

function renderWeeklyStats(moduleId){
  var now = new Date();
  var dayOfWeek = now.getDay();
  var startOfWeek = new Date(now);
  startOfWeek.setDate(now.getDate() - dayOfWeek);
  var days = [];
  for(var i=0; i<7; i++){
    var d = new Date(startOfWeek);
    d.setDate(startOfWeek.getDate()+i);
    days.push(d);
  }
  var weekdays = ['日','一','二','三','四','五','六'];
  var html = '<table class="weekly-table"><tr>';
  days.forEach(function(d){ html += '<th>'+weekdays[d.getDay()]+'</th>'; });
  html += '</tr><tr>';
  var doneCount = 0;
  days.forEach(function(d){
    var ds = formatDate(d);
    var data = getCalData(moduleId, ds);
    if(data.done) doneCount++;
    var cls = data.done ? 'done-cell' : (isFuture(ds) ? '' : 'undone-cell');
    html += '<td class="'+cls+'">'+d.getDate()+'</td>';
  });
  html += '</tr></table>';
  html += '<div style="font-size:11px;color:var(--text-light);margin-top:8px;text-align:center;">本周完成 '+doneCount+'/7 天</div>';
  return html;
}

function renderMonthlyStats(moduleId){
  var now = new Date();
  var stats = getMonthlyCalStats(moduleId, now.getFullYear(), now.getMonth());
  var html = '';
  html += '<div class="cal-stats">';
  html += '<div class="cal-stat-box done-stat"><div class="cal-stat-num">'+stats.done+'</div><div class="cal-stat-label">已完成</div></div>';
  html += '<div class="cal-stat-box"><div class="cal-stat-num">'+stats.total+'</div><div class="cal-stat-label">总天数</div></div>';
  html += '<div class="cal-stat-box rate-stat"><div class="cal-stat-num">'+stats.rate+'%</div><div class="cal-stat-label">完成率</div></div>';
  html += '</div>';
  return html;
}

/* ===== 额外今日打卡（非日历模块） ===== */
function toggleExtraToday(moduleId){
  var today = todayStr();
  var key = 'today_extra_'+moduleId+'_'+today;
  var done = lsGet(key) || false;

/* ============================================================
   通用弹窗
   ============================================================ */
function showModal(title, bodyHTML, actions){
  $('modalTitle').textContent = title;
  $('modalBody').innerHTML = bodyHTML;
  var actionsEl = $('modalActions');
  actionsEl.innerHTML = '';
  actions.forEach(function(a){
    var btn = document.createElement('button');
    btn.className = 'btn ' + a.class;
    btn.textContent = a.text;
    btn.onclick = a.action;
    actionsEl.appendChild(btn);
  });
  $('modalOverlay').classList.add('show');
}
function hideModal(){
  $('modalOverlay').classList.remove('show');
}

/* ============================================================
   PWA: 内嵌 manifest + service worker
   ============================================================ */
function setupPWA(){
  // Manifest
  var manifest = {
    name: '工作台完整版',
    short_name: '工作台',
    description: '每日工作台 - 随笔/英语/瑜伽/护肤/保健/养生/理财/自媒体',
    start_url: '.',
    display: 'standalone',
    orientation: 'portrait',
    background_color: '#FAFBFC',
    theme_color: '#FFE8F0',
    icons: [
      {
        src: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"%3E%3Crect width="192" height="192" rx="42" fill="%23FFE8F0"/%3E%3Ctext x="96" y="130" font-size="90" text-anchor="middle"%3E%E2%9C%85%3C/text%3E%3C/svg%3E',
        sizes: '192x192',
        type: 'image/svg+xml'
      },
      {
        src: 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"%3E%3Crect width="512" height="512" rx="112" fill="%23FFE8F0"/%3E%3Ctext x="256" y="350" font-size="240" text-anchor="middle"%3E%E2%9C%85%3C/text%3E%3C/svg%3E',
        sizes: '512x512',
        type: 'image/svg+xml'
      }
    ]
  };
  var manifestBlob = new Blob([JSON.stringify(manifest)], { type:'application/json' });
  var manifestURL = URL.createObjectURL(manifestBlob);
  var link = document.createElement('link');
  link.rel = 'manifest';
  link.href = manifestURL;
  document.head.appendChild(link);

  // Service Worker
  if('serviceWorker' in navigator){
    var swCode = [
      'var CACHE_NAME = "workbench-v1";',
      'self.addEventListener("install", function(e){',
      '  self.skipWaiting();',
      '});',
      'self.addEventListener("activate", function(e){',
      '  e.waitUntil(self.clients.claim());',
      '});',
      'self.addEventListener("fetch", function(e){',
      '  if(e.request.method !== "GET") return;',
      '  e.respondWith(',
      '    caches.open(CACHE_NAME).then(function(cache){',
      '      return cache.match(e.request).then(function(cached){',
      '        var fetchPromise = fetch(e.request).then(function(networkResp){',
      '          if(networkResp && networkResp.status === 200 && e.request.url.startsWith(self.location.origin)){',
      '            cache.put(e.request, networkResp.clone());',
      '          }',
      '          return networkResp;',
      '        }).catch(function(){ return cached; });',
      '        return cached || fetchPromise;',
      '      });',
      '    })',
      '  );',
      '});'
    ].join('\n');
    var swBlob = new Blob([swCode], { type:'application/javascript' });
    var swURL = URL.createObjectURL(swBlob);
    navigator.serviceWorker.register(swURL).then(function(){
      // registered
    }).catch(function(){
      // ignore
    });
  }
}

/* ============================================================
   初始化
   ============================================================ */
function init(){
  // 加载固定模块自定义名称
  FIXED_MODULES.forEach(function(m){
    var savedName = lsGet('module_name_'+m.id);
    if(savedName) m.name = savedName;
  });

  // 加载自定义模块
  state.customModules = getCustomModules();

  setupPWA();
  renderHeader();
  renderSidebar();
  renderDetail();

  // 绑定日历弹窗事件
  $('calModalCancel').onclick = closeCalModal;
  $('calModalConfirm').onclick = function(){ confirmCalModal(true); };
  $('calModalUncheck').onclick = function(){ confirmCalModal(false); };
  $('calModalOverlay').onclick = function(e){
    if(e.target === $('calModalOverlay')) closeCalModal();
  };

  // 绑定弹窗关闭
  $('modalOverlay').onclick = function(e){
    if(e.target === $('modalOverlay')) hideModal();
  };

  // 新增模块按钮
  $('addModuleBtn').onclick = showAddModuleModal;
}

// 启动
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
